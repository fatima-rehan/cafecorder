spring.application.name=cafecorder

# Locally, DB_URL etc. come from backend/.env (gitignored). On Render they're real env vars.
spring.config.import=optional:file:.env[.properties]

# Render sets PORT; locally we fall back to 8080
server.port=${PORT:8080}

# Supabase session pooler, e.g. jdbc:postgresql://aws-0-ca-central-1.pooler.supabase.com:5432/postgres
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
# Supabase's free tier caps connections, so keep the pool small
spring.datasource.hikari.maximum-pool-size=5

# schema.sql owns the tables. Hibernate only checks the entities match and never creates or drops anything.
spring.sql.init.mode=always
spring.jpa.hibernate.ddl-auto=validate
# Close the DB connection when the service method ends, not after the JSON is written
spring.jpa.open-in-view=false

# Signs login tokens (HS256). At least 32 bytes: openssl rand -base64 48
app.jwt.secret=${JWT_SECRET}

# Comma-separated frontend URLs allowed to call the API, e.g. http://localhost:5173,https://cafecorder.vercel.app
app.cors.allowed-origins=${CORS_ORIGINS:http://localhost:5173}
